name: FREE Channel (every 15 min)

on:
  schedule:
    - cron: "7,22,37,52/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}       # allows manual "Run workflow" button

permissions:
  contents: write             # lets the bot commit its state file back

concurrency:
  group: free-channel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ROLE: free
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      # ⬇️ EDIT THIS: replace with your site / VIP landing link (shows under every free post)
      FOOTER: "https://saintmalkid.github.io/fx-site/checkout.html"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        run: python bot.py

      - name: Commit state (bot memory)
        run: |
          git config user.name  "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state-*.json || true
          git commit -m "update state [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || (git pull --rebase && git push)
